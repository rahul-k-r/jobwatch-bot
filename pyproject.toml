[project]
name = "jobwatch"
version = "0.1.0"
description = "Polls company career sites and alerts on new, non-senior, non-repost postings."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1",
    "tzdata",  # zoneinfo on Windows has no system tz database
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

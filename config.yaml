  - company: NVIDIA
    type: workday
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
    facets:
      locationHierarchy1: [2fcb99c455831013ea52fb338f2932d8]   # United States (tenant-specific ID)

# Personal settings. Companies live in the shared catalog (catalog/*.yaml); secrets and deployment
# settings in .env (see .env.example). Saved edits to this file or the catalog apply without a restart.

# Who postings are judged for; completes "You classify job postings for ...".
profile: >
  a software engineer with a Master's degree and about 3 years of experience who needs US visa sponsorship

filters:
  us_only: true
  require_sponsorship: true   # drop postings that rule out sponsorship / need US citizenship or clearance
  exclude_min_years: 4        # drop when required qualifications ask for this many years or more (LLM)

  # Title must match one of these to be considered at all.
  include_title:
    - '\bsoftware\b'
    - '\b(sde|swe|sre)\b'
    - '\bdeveloper\b'
    - '\b(machine learning|ml|ai|deep learning|data|platform|infrastructure|back[- ]?end|front[- ]?end|full[- ]?stack|systems|cloud|devops|site reliability|reliability)\s+engineer'
    # Customer-facing engineering (current field) and AI-specific titles; phrases, not bare "AI"/"Agent",
    # so "AI Account Executive" or "Agent Support Specialist" don't match.
    - '\bforward[- ]deployed\b'
    - '\bdeployed engineer'
    - '\bsolutions? (engineer|architect)'
    - '\b(customer|integrations?) engineer'
    - '\b(llm|agent|agentic|nlp|mlops|llmops|genai|generative ai|conversational ai|voice ai|speech)\s+engineer'
    # Research roles; PhD-only postings are dropped by the classifier (phd_required).
    - '\bresearch (engineer|scientist)'
    - '\bresearcher\b'

  # Senior markers. A title is dropped only if every part of a combo title
  # ("Software Engineer II/Senior Software Engineer") is senior.
  seniority_title:
    - '\bsenior\b'
    - '\bsr\b\.?'
    - '\bprincipal\b'
    - '(?<!technical )\bstaff\b'   # not "Member of Technical Staff"
    - '\blead\b'
    - '\bdirector\b'
    - '\bmanager\b'
    - '\bhead of\b'
    - '\b(vp|vice president)\b'
    - '(?<!solutions )(?<!solution )\barchitect\b'   # "Solutions Architect" is a role, not a level
    - '\bdistinguished\b'
    - '\bfellow\b'
    - '\bchief\b'

  # Dropped outright wherever they appear in the title.
  exclude_title:
    - '\bintern(ship)?\b'
    - '\bco-?op\b'
    - '\bstudent\b'
    - '\btutor\b'   # xAI "AI Tutor": data-labeling contract work
    - '\b(sourcer|recruit(er|ers|ing)|talent acquisition)\b'   # "Technical Sourcer, Research SWE"
    - '\bsales\b'   # "Software Sales Specialist" passes the \bsoftware\b include
    - '\b(embedded|firmware|fpga|asic|compilers?)\b'   # hardware / low-level work
    - '\b(ts/sci|top secret|secret clearance|clearance required|poly(graph)?|ctj)\b'

# Choices over the catalog, by company name (a name that isn't in the catalog is an error).
companies:
  disable:
    # ITAR "U.S. person" or clearance on nearly every role: not open to a visa holder.
    - SpaceX
    - Anduril
    - Shield AI
    # EU-only hiring; nothing would pass us_only.
    - Aleph Alpha
    - DeepL
    - Black Forest Labs
    - Helsing
    - Celonis
    - Contentful
    - GetYourGuide
    - HelloFresh
    - N26
    - Trade Republic
    - SumUp
    - Qonto
    - Forto
    - Lovable
    - Legora
    - Spotify
    - Vinted
    - Amplemarket
  enable: []   # catalog entries marked `enabled: false` to turn on anyway
  # Company name (exactly as `company:` in the catalog) -> date. Until that date, the company is still
  # polled and its new postings pass every filter, but each alert goes to the low-priority topic tagged
  # "snoozed" and no resume is built. From the date on, alerts are normal again. Useful after applying
  # (a cooldown) or while a company isn't a priority. Works for every adapter, custom ones included:
  #   Microsoft: 2026-12-01            # eightfold
  #   Apple: 2026-12-01                # custom (apple)
  #   NVIDIA: 2027-01-15               # workday
  #   JPMorgan Chase: 2027-01-15       # oracle
  #   "Weights & Biases (CoreWeave)": 2026-12-01   # quote names with special characters
  snooze:
    Amazon: 2026-11-18    # custom (amazon)
    Google: 2026-11-09    # custom (google)
    OpenAI: 2027-04-06    # ashby

# Polling
poll_interval_seconds: 300  # during busy hours; each site gets ~1 request per poll when nothing is new
offpeak:                    # postings cluster in US business hours; poll slower otherwise
  interval_seconds: 1800
  timezone: America/Los_Angeles
  busy_hours: [6, 21]       # local [start, end) hour
  weekdays_only: true
max_pages: 5          # per poll; stops earlier once a page has nothing new
seed_max_pages: 100   # first run per company: record what's already open, alert on nothing (Eightfold is 10/page)

repost:
  created_gap_days: 14   # heuristic: requisition created this long before posting => repost. Tune with real data.
  similarity: 0.9        # description shingle overlap vs same-title postings
  lookback_days: 90

classifier:
  enabled: true               # also needs GEMINI_API_KEY or JOBWATCH_ANTHROPIC_API_KEY; without either, alerts are sent unclassified
  # Pinned: the -latest alias moved to 3.5-flash-lite, which hung on every call (2026-10-13).
  model: gemini-3.1-flash-lite
  # Free tier per model (AI Studio, 2026-10-13): 15 RPM, 250K TPM, 500 RPD for 3.1 and 3.5 Flash Lite,
  # counted separately. 13 RPM keeps a burst of ~15K-token batches under 250K TPM.
  daily_limit: 450            # below the free tier's 500/day for headroom
  requests_per_minute: 13
  # The alias takes over once 3.1 is retired (404); it follows whatever flash-lite is current.
  fallback_model: gemini-flash-lite-latest
  fallback_daily_limit: 450
  fallback_requests_per_minute: 13
  timeout: 60                 # no Gemma in the chain any more; flash-lite answers a batch in seconds
  batch_size: 10
  max_parallel_batches: 3     # a burst's batches run side by side; starts still respect requests_per_minute

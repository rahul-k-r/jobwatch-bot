# Secrets and deployment settings live in .env (see .env.example).

poll_interval_seconds: 300  # during busy hours; each site gets ~1 request per poll when nothing is new
offpeak:                    # postings cluster in US business hours; poll slower otherwise
  interval_seconds: 1800
  timezone: America/Los_Angeles
  busy_hours: [6, 21]       # local [start, end) hour
  weekdays_only: true
max_pages: 5          # per poll; stops earlier once a page has nothing new
seed_max_pages: 100   # first run per company: record what's already open, alert on nothing (Eightfold is 10/page)

filters:
  us_only: true
  require_sponsorship: true   # drop postings that rule out sponsorship / need US citizenship or clearance
  exclude_min_years: 4        # drop when required qualifications ask for this many years or more (LLM)

  # Title must match one of these to be considered at all.
  include_title:
    - '\bsoftware\b'
    - '\b(sde|swe|sre)\b'
    - '\bdeveloper\b'
    - '\b(machine learning|ml|ai|deep learning|data|platform|infrastructure|back[- ]?end|front[- ]?end|full[- ]?stack|systems|cloud|devops|site reliability|reliability)\s+engineer'
    # Customer-facing engineering (current field) and AI-specific titles; phrases, not bare "AI"/"Agent",
    # so "AI Account Executive" or "Agent Support Specialist" don't match.
    - '\bforward[- ]deployed\b'
    - '\bdeployed engineer'
    - '\bsolutions? (engineer|architect)'
    - '\b(customer|integrations?) engineer'
    - '\b(llm|agent|agentic|nlp|mlops|llmops|genai|generative ai|conversational ai|voice ai|speech)\s+engineer'
    # Research roles; PhD-only postings are dropped by the classifier (phd_required).
    - '\bresearch (engineer|scientist)'
    - '\bresearcher\b'

  # Senior markers. A title is dropped only if every part of a combo title
  # ("Software Engineer II/Senior Software Engineer") is senior.
  seniority_title:
    - '\bsenior\b'
    - '\bsr\b\.?'
    - '\bprincipal\b'
    - '(?<!technical )\bstaff\b'   # not "Member of Technical Staff"
    - '\blead\b'
    - '\bdirector\b'
    - '\bmanager\b'
    - '\bhead of\b'
    - '\b(vp|vice president)\b'
    - '(?<!solutions )(?<!solution )\barchitect\b'   # "Solutions Architect" is a role, not a level
    - '\bdistinguished\b'
    - '\bfellow\b'
    - '\bchief\b'

  # Dropped outright wherever they appear in the title.
  exclude_title:
    - '\bintern(ship)?\b'
    - '\bco-?op\b'
    - '\bstudent\b'
    - '\btutor\b'   # xAI "AI Tutor": data-labeling contract work
    - '\b(sourcer|recruit(er|ers|ing)|talent acquisition)\b'   # "Technical Sourcer, Research SWE"
    - '\bsales\b'   # "Software Sales Specialist" passes the \bsoftware\b include
    - '\b(embedded|firmware|fpga|asic|compilers?)\b'   # hardware / low-level work
    - '\b(ts/sci|top secret|secret clearance|clearance required|poly(graph)?|ctj)\b'

repost:
  created_gap_days: 14   # heuristic: requisition created this long before posting => repost. Tune with real data.
  similarity: 0.9        # description shingle overlap vs same-title postings
  lookback_days: 90

classifier:
  enabled: true               # also needs GEMINI_API_KEY; without it, alerts are sent unclassified
  model: gemini-flash-lite-latest
  daily_limit: 450            # below the free tier's 500/day for headroom
  requests_per_minute: 10
  fallback_model: gemma-4-26b-a4b-it   # separate free quota; ~25s/call, so only used when the primary fails
  fallback_daily_limit: 10000
  fallback_requests_per_minute: 10
  batch_size: 10

sources:
  - company: Microsoft
    type: eightfold
    host: apply.careers.microsoft.com
    domain: microsoft.com
    params:
      location: United States
      filter_include_remote: 1
      filter_career_discipline: Software Engineering
      filter_profession: software engineering
    exclude_title:
      - '\bIC ?[4-9]\b'   # Microsoft level codes: IC4 = Senior

  - company: Amazon
    type: amazon
    params:
      'category[]': software-development
      country: USA
    exclude_title:
      - '\bIII\b'   # SDE III = Senior at Amazon (but mid-level at Google, so company-specific)

  - company: Apple
    type: apple
    teams: [teamsAndSubTeams-SFTWR, teamsAndSubTeams-MLAI]   # Software & Services, ML & AI

  - company: IBM
    type: ibm

  # feed.xml only: Google's results pages are robots.txt-disallowed and its ToS make that binding.
  # The feed is regenerated every ~20-25 min; polls in between are cheap 304s.
  # categories: [] = all. Customer Engineers are under SALES_OPERATIONS and DeepMind research
  # scientists under INFORMATION_TECHNOLOGY, so title rules decide instead. Includes DeepMind and YouTube.
  - company: Google
    type: google
    categories: []

  # Older Eightfold API: Netflix hasn't enabled PCSX. robots.txt allows /api/apply.
  - company: Netflix
    type: eightfold
    api: v2
    host: explore.jobs.netflix.net
    domain: netflix.com
    params:
      location: United States
    exclude_title:
      - '\bL[5-9]\b'                                           # "Software Engineer (L5)"; L5 = Senior
      - '\b(engineer|engineering|scientist|developer)\s+[5-9]\b'   # "Analytics Engineer 5"

  - company: Qualcomm
    type: eightfold
    host: careers.qualcomm.com
    domain: qualcomm.com
    params:
      location: United States

  # Workday tenants. Facet keys/IDs are tenant-specific (found via each tenant's `facets` response).
  # US ID bc33aa3152ec42d4995f4791a106ed09 is global; tenants without a country facet are

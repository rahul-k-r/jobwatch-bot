# Workday tenants: host/tenant/site come from the *.myworkdayjobs.com URL. Facet keys/IDs are
# tenant-specific (found via each tenant's `facets` response); check `total` drops when adding one.
# US ID bc33aa3152ec42d4995f4791a106ed09 is global; tenants without a country facet are
# US-filtered client-side after the detail call.
sources:
  - company: NVIDIA
    type: workday
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
    facets:
      locationHierarchy1: [2fcb99c455831013ea52fb338f2932d8]   # United States (tenant-specific ID)
      jobFamilyGroup: [0c40f6bd1d8f10ae43ffaefd46dc7e78]        # Engineering

  - company: Red Hat
    type: workday
    host: redhat.wd5.myworkdayjobs.com
    tenant: redhat
    site: jobs
    facets:
      a: [bc33aa3152ec42d4995f4791a106ed09]   # yes, the country facet key is literally "a"

